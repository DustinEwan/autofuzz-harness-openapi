name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The plugin's own suite. The wire-vocabulary contract test reads the engine's docs, so the
  # engine is checked out beside this repository and named with AFZ_DOCS. There is no install
  # step: the plugin imports the Node standard library and nothing else, and the fixture
  # service listens on a kernel-chosen port.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: DustinEwan/autofuzz
          path: .engine

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: AFZ_DOCS=$GITHUB_WORKSPACE/.engine/docs node --test

  # The conformance gate, run through the product command rather than a bespoke harness:
  # `afz install-harness` drives the suite and prints the report. The lifecycle block in the
  # emitted project starts the petstore service itself, on a port the plugin only learns
  # through AFZ_PORT.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install afz
        run: cargo install --git https://github.com/DustinEwan/autofuzz.git afz-cli --locked

      - name: Validate
        run: afz install-harness "$GITHUB_WORKSPACE" --json > report.json

      # The goldens this repository publishes: zero violations, nine template passes, and
      # the same three justified absences on both sides - the crash frame cannot name the
      # document, and no runtime observer counts per-call edges. A deleted or gutted
      # validator fails the second assertion.
      - name: Assert the report
        run: |
          jq -e '((.violations | length) == 0)
                 and ((.template.properties | map(select(.verdict == "not-applicable") | .id) | sort) == ["coverage-digest-live","crash-unguarded","stdout-purity"])
                 and ((.template.properties | map(select(.verdict == "pass")) | length) == 9)' report.json
          jq -e '((.validator.properties | map(select(.verdict == "pass")) | length) == 5)
                 and ((.validator.properties | map(select(.verdict == "not-applicable") | .id) | sort) == ["coverage-digest-live","crash-unguarded"])' report.json
